[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-momentum-backtest"
version = "0.1.0"
description = "A reproducible Python backtest of a monthly ETF momentum rotation strategy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyarrow",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ruff",
]

[project.scripts]
etf-momentum = "etf_momentum_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"